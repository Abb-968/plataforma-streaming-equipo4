services:
  db:
    image: postgres:15-alpine
    container_name: streaming_db
    environment:
      POSTGRES_USER: streaming_user
      POSTGRES_PASSWORD: streaming_pass
      POSTGRES_DB: streaming_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: streaming_redis
    ports:
      - "6379:6379"

  api:
    build: ./backend
    container_name: streaming_api
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://streaming_user:streaming_pass@db:5432/streaming_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: clave_secreta_mvp_equipo4
    depends_on:
      - db
      - redis

volumes:
  pgdata: